<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="60" cy="60" r="58" fill="#0d1b2a"/>
  
  <!-- Outer ring - compass rose -->
  <circle cx="60" cy="60" r="52" stroke="#1e3a5f" stroke-width="2" fill="none"/>
  <circle cx="60" cy="60" r="46" stroke="#1e3a5f" stroke-width="1" fill="none"/>
  
  <!-- Compass cardinal points -->
  <g stroke="#f4731b" stroke-width="2.5" fill="none" stroke-linecap="round">
    <!-- North -->
    <path d="M60 14 L60 26"/>
    <path d="M56 18 L60 14 L64 18"/>
    <!-- East -->
    <path d="M94 60 L106 60"/>
    <path d="M102 56 L106 60 L102 64"/>
    <!-- South -->
    <path d="M60 94 L60 106"/>
    <path d="M56 102 L60 106 L64 102"/>
    <!-- West -->
    <path d="M14 60 L26 60"/>
    <path d="M22 56 L18 60 L22 64"/>
  </g>
  
  <!-- Intercardinal points (smaller) -->
  <g stroke="#f4731b" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.6">
    <path d="M32 32 L40 40"/>   <!-- NE -->
    <path d="M80 32 L88 40"/>   <!-- SE -->
    <path d="M80 80 L88 72"/>   <!-- SW -->
    <path d="M32 80 L40 72"/>   <!-- NW -->
  </g>
  
  <!-- Central paper plane taking off -->
  <g transform="translate(60, 60) rotate(-15)">
    <!-- Plane body trail -->
    <path d="M-24 8 C-30 12 -34 20 -32 32" stroke="#f4731b" stroke-width="2" fill="none" opacity="0.4" stroke-dasharray="6 4" stroke-linecap="round"/>
    <path d="M-24 -4 C-30 -8 -34 -16 -32 -28" stroke="#f4731b" stroke-width="2" fill="none" opacity="0.4" stroke-dasharray="6 4" stroke-linecap="round"/>
    
    <!-- Paper plane - bottom wing (solid) -->
    <path d="M-12 0 L0 -24 L12 0 L0 18 Z" fill="#f4731b"/>
    <!-- Paper plane - top wing (lighter) -->
    <path d="M-12 0 L0 -24 L12 0 Z" fill="#ff9f43"/>
    <!-- Paper plane - fold line -->
    <path d="M0 -24 L0 18" stroke="#0d1b2a" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
    <!-- Cockpit dot -->
    <circle cx="0" cy="-8" r="3" fill="#0d1b2a"/>
    
    <!-- Motion lines behind -->
    <g stroke="#f4731b" stroke-width="1.5" fill="none" opacity="0.5" stroke-linecap="round">
      <path d="M-36 12 L-44 16"/>
      <path d="M-38 4 L-46 4"/>
      <path d="M-36 -4 L-44 -8"/>
    </g>
  </g>
  
  <!-- Subtle globe grid behind plane -->
  <g stroke="#1e3a5f" stroke-width="0.8" fill="none" opacity="0.3">
    <circle cx="60" cy="60" r="35"/>
    <ellipse cx="60" cy="60" rx="35" ry="10"/>
    <ellipse cx="60" cy="60" rx="10" ry="35"/>
  </g>
</svg>
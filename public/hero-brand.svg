<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Deep navy background with subtle gradient -->
  <defs>
    <linearGradient id="skyGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="50%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#2d5a8a"/>
    </linearGradient>
    <linearGradient id="horizonGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4731b" stop-opacity="0"/>
      <stop offset="50%" stop-color="#f4731b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ff9f43" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f4731b" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#ff9f43" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#f4731b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f4731b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f4731b" stop-opacity="0"/>
    </radientGradient>
  </defs>
  
  <!-- Sky gradient -->
  <rect width="1200" height="400" fill="url(#skyGradient)"/>
  
  <!-- Subtle atmosphere glow at horizon -->
  <ellipse cx="600" cy="380" rx="400" ry="80" fill="url(#horizonGlow)"/>
  
  <!-- Stars (subtle) -->
  <g fill="#ffffff" opacity="0.4">
    <circle cx="150" cy="80" r="1.5"/>
    <circle cx="300" cy="60" r="1"/>
    <circle cx="480" cy="100" r="1"/>
    <circle cx="650" cy="70" r="1.5"/>
    <circle cx="820" cy="90" r="1"/>
    <circle cx="980" cy="50" r="1.5"/>
    <circle cx="1100" cy="110" r="1"/>
    <circle cx="200" cy="140" r="1"/>
    <circle cx="720" cy="130" r="1"/>
    <circle cx="1000" cy="150" r="1"/>
  </g>
  
  <!-- Large sun/moon glow on the right -->
  <circle cx="1050" cy="120" r="120" fill="url(#sunGlow)"/>
  <circle cx="1050" cy="120" r="40" fill="#fff8e7" opacity="0.8"/>
  <circle cx="1050" cy="120" r="25" fill="#fffde7" opacity="1"/>
  
  <!-- Paper planes flying in formation (3 planes) -->
  <g transform="translate(200, 180) rotate(-12)">
    <!-- Plane 1 (largest, foreground) -->
    <path d="M-20 0 L0 -32 L20 0 L0 24 Z" fill="#f4731b" filter="drop-shadow(0 4px 12px rgba(244,115,27,0.4))"/>
    <path d="M-20 0 L0 -32 L20 0 Z" fill="#ff9f43"/>
    <path d="M0 -32 L0 24" stroke="#0d1b2a" stroke-width="2" stroke-linecap="round" opacity="0.25"/>
    <circle cx="0" cy="-10" r="4" fill="#0d1b2a" opacity="0.8"/>
    <!-- Trail -->
    <path d="M-48 16 C-56 24 -60 36 -56 48" stroke="#f4731b" stroke-width="3" fill="none" opacity="0.3" stroke-dasharray="8 6" stroke-linecap="round"/>
    <path d="M-52 -4 C-60 -12 -64 -20 -60 -32" stroke="#f4731b" stroke-width="3" fill="none" opacity="0.3" stroke-dasharray="8 6" stroke-linecap="round"/>
  </g>
  
  <g transform="translate(450, 100) rotate(-18) scale(0.7)">
    <!-- Plane 2 (medium, middle) -->
    <path d="M-20 0 L0 -32 L20 0 L0 24 Z" fill="#f4731b" opacity="0.8" filter="drop-shadow(0 3px 8px rgba(244,115,27,0.3))"/>
    <path d="M-20 0 L0 -32 L20 0 Z" fill="#ff9f43"/>
    <path d="M0 -32 L0 24" stroke="#0d1b2a" stroke-width="2" stroke-linecap="round" opacity="0.2"/>
    <circle cx="0" cy="-10" r="3" fill="#0d1b2a" opacity="0.7"/>
    <!-- Trail -->
    <path d="M-48 16 C-56 24 -60 36 -56 48" stroke="#f4731b" stroke-width="2" fill="none" opacity="0.2" stroke-dasharray="8 6" stroke-linecap="round"/>
    <path d="M-52 -4 C-60 -12 -64 -20 -60 -32" stroke="#f4731b" stroke-width="2" fill="none" opacity="0.2" stroke-dasharray="8 6" stroke-linecap="round"/>
  </g>
  
  <g transform="translate(700, 220) rotate(-8) scale(0.55)">
    <!-- Plane 3 (smallest, background) -->
    <path d="M-20 0 L0 -32 L20 0 L0 24 Z" fill="#f4731b" opacity="0.6"/>
    <path d="M-20 0 L0 -32 L20 0 Z" fill="#ff9f43"/>
    <path d="M0 -32 L0 24" stroke="#0d1b2a" stroke-width="1.5" stroke-linecap="round" opacity="0.15"/>
    <circle cx="0" cy="-10" r="2" fill="#0d1b2a" opacity="0.6"/>
  </g>
  
  <!-- Compass rose watermark (subtle, bottom-left) -->
  <g transform="translate(100, 300) scale(0.8)" opacity="0.12">
    <circle cx="0" cy="0" r="50" stroke="#f4731b" stroke-width="1.5" fill="none"/>
    <circle cx="0" cy="0" r="40" stroke="#f4731b" stroke-width="1" fill="none"/>
    <g stroke="#f4731b" stroke-width="2" fill="none" stroke-linecap="round">
      <path d="M0 -50 L0 -35"/>
      <path d="M-5 40 L0 50 L5 40"/>
      <path d="M35 0 L50 0"/>
      <path d="M40 -5 L50 0 L40 5"/>
      <path d="M0 35 L0 50"/>
      <path d="M-5 -40 L0 -50 L5 -40"/>
      <path d="M-35 0 L-50 0"/>
      <path d="M-40 -5 L-50 0 L-40 5"/>
    </g>
  </g>
  
  <!-- Mountain silhouettes at bottom (Brazil landscape suggestion) -->
  <path d="M0 320 Q150 240 300 280 Q400 200 500 260 Q600 180 700 240 Q800 160 900 220 Q1000 140 1100 200 Q1200 180 1200 260 L1200 400 L0 400 Z" fill="#0a1526" opacity="0.9"/>
  <path d="M0 340 Q200 260 400 300 Q550 220 700 280 Q850 200 1000 260 Q1150 180 1200 240 L1200 400 L0 400 Z" fill="#0d1b2a" opacity="0.8"/>
  
  <!-- Brand mark at top-left (small) -->
  <g transform="translate(80, 60) scale(0.6)" opacity="0.3">
    <circle cx="0" cy="0" r="30" fill="#0d1b2a"/>
    <circle cx="0" cy="0" r="24" stroke="#1e3a5f" stroke-width="1" fill="none"/>
    <g stroke="#f4731b" stroke-width="1.5" fill="none" stroke-linecap="round">
      <path d="M0 -24 L0 -17"/>
      <path d="M-17 20 L0 24 L5 20"/>
      <path d="M17 0 L24 0"/>
      <path d="M20 -5 L24 0 L20 5"/>
      <path d="M0 17 L0 24"/>
      <path d="M-5 -20 L0 -24 L5 -20"/>
      <path d="M-17 0 L-24 0"/>
      <path d="M-20 -5 L-24 0 L-20 5"/>
    </g>
    <g transform="rotate(-15)">
      <path d="M-6 0 L0 -12 L6 0 L0 8 Z" fill="#f4731b" opacity="0.5"/>
      <path d="M-6 0 L0 -12 L6 0 Z" fill="#ff9f43" opacity="0.5"/>
    </g>
  </g>
</svg>
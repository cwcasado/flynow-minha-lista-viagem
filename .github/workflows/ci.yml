name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Design system, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Tokens do design system
        run: node scripts/verificar-tokens.mjs

      - name: Contraste WCAG AA
        run: node scripts/verificar-contraste.mjs

      - name: Assets (logos e fontes)
        run: node scripts/verificar-assets.mjs

      - name: Testes
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build (tsc + vite)
        run: npm run build
